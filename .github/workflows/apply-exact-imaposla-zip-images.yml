name: Apply exact ImaPosla ZIP images

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-exact-imaposla-zip-images.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download exact uploaded ImaPosla images
        shell: bash
        run: |
          set -euo pipefail
          dir='public/images/cases/imaposla'
          mkdir -p "$dir"

          curl -L --fail --retry 3 -o "$dir/imaposla-kategorije-poslova.webp" 'https://media.canva.com/v2/image-resize/format:WEBP/height:858/quality:90/uri:ifs%3A%2F%2FM%2F78f70ced-169f-46b6-8cc3-4a73a095e8b0/watermark:F/width:395?csig=AAAAAAAAAAAAAAAAAAAAACrOQHgQW_elQDAxNU2e7Ynuk3Uphhrpve-ddcvQe5U4&exp=1786532622&osig=AAAAAAAAAAAAAAAAAAAAAHiNDUvzwFCVv1qA_TJZN5JniuGjzccQC5gLIKkb8GLL&signer=media-rpc&x-canva-quality=original'
          curl -L --fail --retry 3 -o "$dir/imaposla-usluge-marketplace.webp" 'https://media.canva.com/v2/image-resize/format:WEBP/height:850/quality:90/uri:ifs%3A%2F%2FM%2Fa620b030-534d-4eb8-aaf3-b2efa6100211/watermark:F/width:390?csig=AAAAAAAAAAAAAAAAAAAAANvwF2zbsSe0wD6DMgiDwHUP64WOIOsvURgFe9b4hhN4&exp=1786535056&osig=AAAAAAAAAAAAAAAAAAAAAC51xZ3pOzzjsHcmvkBwh5-1900FbaO-X2xHQ5Ywjxnd&signer=media-rpc&x-canva-quality=original'
          curl -L --fail --retry 3 -o "$dir/imaposla-pocetna-platforma-poslovi.webp" 'https://media.canva.com/v2/image-resize/format:WEBP/height:795/quality:90/uri:ifs%3A%2F%2FM%2F6d5d4756-bd1d-4c07-8b7a-a1991dd72f26/watermark:F/width:1100?csig=AAAAAAAAAAAAAAAAAAAAAFk700vkakzA1f7FkgE3vlY7GZVR6bVtqCMYFCCmOsao&exp=1786535134&osig=AAAAAAAAAAAAAAAAAAAAAFvj3xNd5FNwmnj8X-0uTpO_oAecKrziO0QNUZfWBKts&signer=media-rpc&x-canva-quality=original'
          curl -L --fail --retry 3 -o "$dir/imaposla-firme-poslodavci.webp" 'https://media.canva.com/v2/image-resize/format:WEBP/height:795/quality:90/uri:ifs%3A%2F%2FM%2F0acf1982-7aeb-4b0c-8e0b-9e2d3449e7ea/watermark:F/width:1100?csig=AAAAAAAAAAAAAAAAAAAAAHlDraxXlkKNh0lAP6Y_DXXwvfNYKpZEjYFepssZwMG9&exp=1786531942&osig=AAAAAAAAAAAAAAAAAAAAAJwrEQQ8ik-kjFVpkQtpbldq13Kh04E60ofwWPLlunEj&signer=media-rpc&x-canva-quality=original'
          curl -L --fail --retry 3 -o "$dir/imaposla-brzi-angazmani.webp" 'https://media.canva.com/v2/image-resize/format:WEBP/height:799/quality:90/uri:ifs%3A%2F%2FM%2F27bfee40-2a59-4f48-a048-d4daafc5f6c0/watermark:F/width:1100?csig=AAAAAAAAAAAAAAAAAAAAAK7WAWFArATu93LT7N9s3n1Z-MN3BjMXlD-Y53LXJtET&exp=1786532873&osig=AAAAAAAAAAAAAAAAAAAAAF8N72ngiGzLm4d_J81N3o5AOg67t97atllWvM9_nLZr&signer=media-rpc&x-canva-quality=original'
          curl -L --fail --retry 3 -o "$dir/imaposla-oglasi-za-posao.webp" 'https://media.canva.com/v2/image-resize/format:WEBP/height:681/quality:90/uri:ifs%3A%2F%2FM%2Fd1ceaab5-fce2-4d88-aa68-4e596ee383ba/watermark:F/width:510?csig=AAAAAAAAAAAAAAAAAAAAAJp8F0WZPB0zwd4j1A3uuJNdGWJFJE6tRIfh648oQ11l&exp=1786532921&osig=AAAAAAAAAAAAAAAAAAAAAOh96-ZypdqxhvOfziQ41sIzLisDPlhnIllsI4xkQcs0&signer=media-rpc&x-canva-quality=original'

          file "$dir"/*.webp
          identify "$dir/imaposla-kategorije-poslova.webp"
          identify "$dir/imaposla-usluge-marketplace.webp"
          identify "$dir/imaposla-pocetna-platforma-poslovi.webp"
          identify "$dir/imaposla-firme-poslodavci.webp"
          identify "$dir/imaposla-brzi-angazmani.webp"
          identify "$dir/imaposla-oglasi-za-posao.webp"

      - name: Commit exact ZIP images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/cases/imaposla/*.webp
          if git diff --cached --quiet; then
            echo 'No image changes detected.'
            exit 0
          fi
          git commit -m 'Replace ImaPosla images with exact uploaded ZIP set'
          git push origin HEAD:main
