name: Apply ImaPosla gallery update

on:
  push:
    branches: [main]
    paths:
      - 'tmp/imaposla-gallery-update.zip'
      - '.github/workflows/apply-imaposla-gallery.yml'

permissions:
  contents: write

concurrency:
  group: apply-imaposla-gallery
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract gallery update
        run: unzip -o tmp/imaposla-gallery-update.zip -d .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Validate production build
        run: npm run build

      - name: Commit gallery replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/cases/imaposla/*.webp src/data/case-gallery-overrides.ts src/components/case-media.tsx
          git rm tmp/imaposla-gallery-update.zip .github/workflows/apply-imaposla-gallery.yml
          git commit -m "Replace ImaPosla gallery screenshots"
          git push
