name: SR-EN structural parity
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/full-en-sr-parity-2026-11-14]

permissions:
  contents: read

jobs:
  bilingual:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build and source validation
        run: npm run build
      - name: Verify rendered SR/EN section parity
        run: node scripts/audit-en-parity.mjs
      - name: Prepare Chromium for full visual and functional bilingual QA
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test SR and EN in real browser at three screen widths
        run: node scripts/browser-parity.mjs
      - name: Upload bilingual QA report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sindikat-full-bilingual-browser-qa
          path: |
            reports/browser-parity.json
            reports/bilingual-screenshots/
          if-no-files-found: ignore
          retention-days: 7
