name: Capture real portfolio website screens
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/capture-live-portfolio.yml']
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture real public site screenshots
        run: node scripts/capture-real-portfolio-sites.mjs
      - name: Commit verified live captures to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/cases/imaposla/*-live-*.png public/images/cases/hive-agency/*-live-*.png
          git diff --cached --quiet && exit 1
          git commit -m "Capture authentic public screens from ImaPosla.me and Hive Agency"
          git push origin HEAD:feature/live-portfolio-screenshots-20261117
