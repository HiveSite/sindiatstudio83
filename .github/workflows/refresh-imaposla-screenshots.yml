name: Refresh ImaPosla gallery

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/finish-imaposla-gallery
    paths:
      - 'scripts/capture-imaposla-screenshots.mjs'
      - '.github/workflows/refresh-imaposla-screenshots.yml'

permissions:
  contents: write

concurrency:
  group: refresh-imaposla-gallery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install project dependencies
        run: npm install --no-package-lock

      - name: Install screenshot tooling
        run: |
          npm install --no-save --no-package-lock playwright sharp
          npx playwright install --with-deps chromium

      - name: Generate fitted gallery screenshots
        run: node scripts/capture-imaposla-screenshots.mjs

      - name: Validate production build
        run: npm run build

      - name: Commit gallery replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/images/cases/imaposla src/data/case-gallery-overrides.ts
          if git diff --cached --quiet; then
            echo "No gallery changes to commit."
            exit 0
          fi
          git commit -m "Replace ImaPosla gallery with fitted screenshots"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
