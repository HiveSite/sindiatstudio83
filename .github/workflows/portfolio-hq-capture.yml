name: Portfolio real high-resolution screenshots
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/portfolio-hq-capture.yml']
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser
        run: |
          npm ci
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture high-resolution screenshots from the real ImaPosla.me
        run: node scripts/capture-imaposla-hq.mjs
      - name: Commit authentic images to source branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/cases/imaposla/imaposla-hq-*.jpg
          git diff --cached --quiet && exit 1
          git commit -m "Capture premium-resolution real ImaPosla.me screens at 2x and 3x"
          git push origin HEAD:${{ github.head_ref }}
