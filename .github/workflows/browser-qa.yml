name: Browser QA V7

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/browser-smoke.mjs'
      - '.github/workflows/browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install project packages
        run: npm ci --no-audit --no-fund
      - name: Build Next.js and validate site
        run: npm run check
      - name: Install Chromium runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run browser QA and screenshots
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/studio83-browser.log 2>&1 &
          sleep 2
          node scripts/browser-smoke.mjs
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio83-v7-mobile-desktop
          path: qa-screenshots/
          if-no-files-found: ignore
          retention-days: 14
