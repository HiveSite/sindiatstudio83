name: Validate Studio83

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-studio83-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run full production checks
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run check

      - name: Verify exported production pages
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          set -eu
          for page in index.html usluge/index.html industrije/index.html radovi/index.html o-nama/index.html blog/index.html kontakt/index.html sitemap.xml robots.txt; do
            if [ ! -s "out/$page" ]; then
              echo "Missing or empty exported file: out/$page" >&2
              exit 1
            fi
          done
          echo 'Verified public pages, sitemap and robots output.'
