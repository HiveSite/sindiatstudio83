name: Export repository artifact

on:
  push:
    branches: [agent/use-exact-uploaded-imaposla-images]
    paths: ['.github/workflows/export-repo-artifact.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove git metadata
        run: rm -rf .git
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: sindikatstudio83-source
          path: .
          include-hidden-files: true
          retention-days: 1
